name: Docker Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (defaults to the short commit SHA)"
        required: false
        type: string
      latest:
        description: "Also move the `latest` tag (a build from a git tag always does)"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Target platforms"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      channel:
        description: "release: ghcr.io/<owner>/barynt · beta: ghcr.io/<owner>/barynt-beta (never latest)"
        required: false
        type: choice
        options: [release, beta]
        default: release
      version:
        description: "Version written into the image's package.json (what the app says it is); empty = as in the branch"
        required: false
        type: string
  # Called by release.yml right after a release is published, on the new
  # tag — same build, without anyone starting it by hand.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      latest:
        type: boolean
        default: false
      platforms:
        type: string
        default: "linux/amd64,linux/arm64"
      ref:
        description: "What to check out (the release tag); empty = the triggering commit"
        type: string
        default: ""
      # Called by beta.yml (BARY-233): a pre-release into an image of its own.
      channel:
        type: string
        default: release
      version:
        type: string
        default: ""

jobs:
  vars:
    name: Determine build parameters
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.vars.outputs.image }}
      tags: ${{ steps.vars.outputs.tags }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Determine image tag and name
        id: vars
        run: |
          # The tag is the bare version — "1.0.0", never "v1.0.0": a leading
          # "v" (the git tag's own, or typed in) is dropped.
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
            tag="${tag#v}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            tag="${tag#v}"
          else
            tag="$(echo "${{ github.sha }}" | cut -c1-7)"
          fi
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          # The image's name is set here, not taken from the repository's
          # (BARY-233): that's `barynt-web` since the move, while compose,
          # Helm and the installer pull `ghcr.io/<owner>/barynt`. A beta has
          # an image of its own, so nothing about it can reach a release's.
          if [ "${{ inputs.channel }}" = "beta" ]; then
            image="ghcr.io/$owner/barynt-beta"
            legacy=""
          else
            image="ghcr.io/$owner/barynt"
            # Where releases went before; tagged too until nobody pulls it.
            legacy="ghcr.io/$owner/barynt-web"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          # `latest` is the newest release: only a release build from a git
          # tag, or one asked to (`latest` input), moves it. A plain build
          # from a branch (a test image) only gets its own tag, and a beta
          # moves `beta` in its own image instead — so neither can replace
          # what `latest` points to.
          {
            echo "tags<<EOF"
            echo "$image:$tag"
            [ -n "$legacy" ] && echo "$legacy:$tag"
            if [ "${{ inputs.channel }}" = "beta" ]; then
              echo "$image:beta"
            elif [ "${{ github.ref_type }}" = "tag" ] || [ "${{ inputs.latest }}" = "true" ]; then
              echo "$image:latest"
              [ -n "$legacy" ] && echo "$legacy:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Ein Runner pro Zielplattform, statt QEMU-Emulation für den eigentlichen
      # Image-Build: `bun run build` (Next/SWC) unter voller Emulation lief
      # hier für linux/arm64, sobald die App über das Anfangs-Scaffold
      # hinausgewachsen war, viele Stunden statt Minuten und hing den Job
      # faktisch auf (siehe Run 34495749559 — nach ~5h noch bei "Build and
      # push"). Native arm64-GitHub-Runner (ubuntu-24.04-arm) beheben das.
      - name: Build platform matrix
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
        run: |
          include="[]"
          IFS=',' read -ra plats <<< "$PLATFORMS"
          for p in "${plats[@]}"; do
            case "$p" in
              linux/amd64) runner="ubuntu-24.04" ;;
              linux/arm64) runner="ubuntu-24.04-arm" ;;
              *)
                echo "::error::no native runner configured for platform '$p'"
                exit 1
                ;;
            esac
            include="$(jq -c --arg p "$p" --arg r "$runner" --arg s "${p//\//-}" \
              '. + [{platform: $p, runner: $r, slug: $s}]' <<< "$include")"
          done
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  scan:
    name: Build & Scan (amd64)
    needs: vars
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # A beta says which it is (BARY-233): the app reads its version from
      # package.json — the update card, release notes and plugins'
      # minBaryntVersion go by it. Only in this checkout, never committed.
      - name: Write the version into package.json
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.new
          mv package.json.new package.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Nur amd64, nur lokal geladen — Trivy kann kein Multi-Arch-Manifest
      # scannen, und diese Plattform läuft ohnehin nativ.
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          # Same fix as the app build step below (see its comment) — without
          # this, the scan was actually built from the `migrate` stage,
          # which deliberately keeps the full `prisma` CLI and its deps
          # (mysql2, deepmerge-ts) instead of the pruned `runner`/app image
          # the scan is meant to represent.
          target: runner
          platforms: linux/amd64
          load: true
          tags: ${{ needs.vars.outputs.image }}:scan
          # Fresh `apt-get upgrade` on every run (see the Dockerfile).
          build-args: APT_REFRESH=${{ github.run_id }}
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.vars.outputs.image }}:scan
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          # Explicit, not relying on the action's own default CWD lookup —
          # see .trivyignore's header for what's suppressed here and why
          # (each entry verified against the GHSA API as already patched).
          trivyignores: .trivyignore

      - name: Upload scan results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-docker-image

  # Erst ab hier wird tatsächlich in die Registry geschrieben — nur wenn der
  # Scan oben bestanden hat. Ein Job pro Plattform, auf ihrem jeweils
  # nativen Runner (siehe "Build platform matrix" oben), Push nur by
  # digest — das eigentliche Manifest (mit den Tags) entsteht erst im
  # "merge"-Job.
  build:
    name: Build & Push (${{ matrix.platform }})
    needs: [vars, scan]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.vars.outputs.matrix) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # A beta says which it is (BARY-233): the app reads its version from
      # package.json — the update card, release notes and plugins'
      # minBaryntVersion go by it. Only in this checkout, never committed.
      - name: Write the version into package.json
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.new
          mv package.json.new package.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # Explicit: without it a multi-stage build builds the *last* stage
          # of the Dockerfile, not necessarily `runner` (the app).
          target: runner
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          # Links the package to this repository, so a new one (barynt,
          # barynt-beta) takes its visibility and Actions may push to it.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.vars.outputs.tag }}
          outputs: type=image,name=${{ needs.vars.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: APT_REFRESH=${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest & sign
    needs: [vars, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tag_args=()
          while IFS= read -r t; do
            [ -n "$t" ] && tag_args+=(-t "$t")
          done <<< "${{ needs.vars.outputs.tags }}"

          docker buildx imagetools create "${tag_args[@]}" \
            $(printf '${{ needs.vars.outputs.image }}@sha256:%s ' *)

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # cosign resolves the tag to its digest before signing, so signing by
      # tag here still produces a digest-pinned signature.
      - name: Sign image (keyless)
        run: |
          # Every image name it went to, by its version tag.
          while IFS= read -r t; do
            case "$t" in *":${{ needs.vars.outputs.tag }}") cosign sign --yes "$t" ;; esac
          done <<< "${{ needs.vars.outputs.tags }}"
